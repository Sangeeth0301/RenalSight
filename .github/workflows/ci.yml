name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r mcp_server/requirements.txt
      - name: Run pytest
        working-directory: backend
        env:
          SCHEDULER_ENABLED: "false"
        run: python -m pytest tests -q

  frontend:
    name: Website type check, build and language files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Language files (key, placeholder and care-plan-code parity)
        run: python frontend/i18n/check_i18n.py | tail -3
      - name: Install website packages
        working-directory: frontend/web
        run: npm ci
      - name: Type check and production build
        working-directory: frontend/web
        run: npm run build

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install website and Chromium
        working-directory: frontend/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the backend and seed demo accounts
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key-ci-only-secret-key-1234567890
          SCHEDULER_ENABLED: "false"
          BUDDY_MESSAGES_PER_MINUTE: "60"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          python seed_demo.py
          python create_admin.py admin@example.com "Demo@12345" "Admin"
      - name: Start the website (development and production preview)
        working-directory: frontend/web
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 > ../web-dev.log 2>&1 &
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 > ../web-preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173 > /dev/null && curl -sf http://127.0.0.1:4173 > /dev/null && break; sleep 1; done
      - name: Run Playwright tests
        working-directory: frontend/web
        run: npx playwright test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            frontend/web/test-results
            backend.log
            web-dev.log
            web-preview.log
          if-no-files-found: ignore
